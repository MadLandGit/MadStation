<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"/>
<link href="developer-visual-debug.css" rel="stylesheet"/>
<title>Parallax Jungle — Mad Station</title>
<style>
body{--bg:#0a1410;--s1:#101c17;--s2:#17261f;--line:#2a3d34;--text:#eef6f1;--muted:#9bb0a5;--a:#7be0a4;--on:#05140c;--glass:rgb(10 20 16/.8);--c1:#7c9cff;--c2:#b18cff;--c3:#ff8bb5;--c4:#ffb36b;--c5:#4fd8a4;--c6:#5ccfe0;--ok:#4fd8a4;--e1:#ff9ac1;--e2:#a8e063;--vine:#3f7a3a;color-scheme:dark}
body[data-theme=light]{--bg:#b8cdbd;--s1:#fff;--s2:#eef6f1;--line:#cfdcd4;--text:#12241a;--muted:#546a5d;--a:#2f8f5a;--on:#fff;--glass:rgb(255 255 255/.82);--c1:#3d63d8;--c2:#7447d8;--c3:#c93580;--c4:#c0640f;--c5:#12895c;--c6:#0f8497;--ok:#12895c;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
h2,p,ul{margin:0;padding:0}ul{list-style:none}
[data-h="1"]{--h:var(--c1)}[data-h="2"]{--h:var(--c2)}[data-h="3"]{--h:var(--c3)}[data-h="4"]{--h:var(--c4)}[data-h="5"]{--h:var(--c5)}[data-h="6"]{--h:var(--c6)}
#fx{position:fixed;inset:0;width:100%;height:100%}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgb(0 12 6/.38))}
.home{position:fixed;inset:0}
#world{position:absolute;inset:0;pointer-events:none;z-index:10}
@keyframes spin{to{rotate:360deg}}

/* top bar */
.top{position:absolute;left:0;right:0;top:0;z-index:30;display:grid;grid-template-columns:auto minmax(200px,420px) 1fr;gap:14px;align-items:center;padding:14px clamp(14px,3vw,40px)}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgb(0 10 5/.42),transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;white-space:nowrap;color:#fff;text-shadow:0 1px 8px rgb(0 0 0/.5)}.brand b{color:var(--a)}
.mark{width:32px;height:32px;display:grid;place-items:center;color:var(--a);perspective:220px}.mark svg{width:30px;height:30px;animation:logo 7s linear infinite;filter:drop-shadow(0 0 8px var(--a))}@keyframes logo{to{transform:rotateY(360deg)}}
kbd{border:1px solid var(--line);border-radius:7px;padding:1px 8px;font:600 11px/1.6 inherit;color:var(--muted)}
.top-r{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--glass);;color:var(--muted);font-size:12.5px}
.chip b{color:var(--text);font-variant-numeric:tabular-nums}
.chip .bar{width:34px;height:4px;border-radius:3px;background:color-mix(in srgb,var(--muted) 25%,transparent);overflow:hidden}
.chip .bar u{display:block;height:100%;width:0;border-radius:inherit;background:var(--a);transition:width .8s}.chip .cb u{background:var(--c4)}
.chgm{color:var(--text)}.chgm svg{width:14px;height:14px;fill:currentColor;stroke:none;color:var(--c4)}.chgm:hover{border-color:var(--a)}
.icon{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--glass);;color:var(--muted);transition:.15s}
.icon svg{width:17px;height:17px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}.icon:hover{border-color:var(--a);color:var(--text)}.icon:hover svg{transform:rotate(90deg) scale(1.12)}
.season-controls{position:relative;display:flex;align-items:center;gap:4px;flex:none;margin-right:-3px}
.season-timing-button{display:grid;place-items:center;flex:0 0 32px;width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--glass);color:var(--muted);cursor:pointer;transition:border-color .18s,background .18s,color .18s,transform .18s}
.season-timing-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.season-timing-button:hover,.season-timing-button[aria-expanded="true"],.season-timing-button[aria-pressed="true"]{color:var(--text);border-color:var(--a);background:color-mix(in srgb,var(--a) 12%,var(--glass));transform:rotate(-8deg)}
.season-timing-menu{position:absolute;z-index:100;left:0;top:calc(100% + 8px);width:220px;padding:11px;border:1px solid var(--line);border-radius:14px;background:var(--s1);box-shadow:0 14px 36px rgba(0,0,0,.32);color:var(--text);backdrop-filter:blur(18px)}
.season-timing-menu[hidden]{display:none!important}
.season-timing-head{display:grid;gap:3px;padding-bottom:8px;border-bottom:1px solid var(--line)}.season-timing-head strong{font-size:12px}.season-timing-head span{font-size:10px;color:var(--muted)}
.season-auto-toggle{display:flex;align-items:center;gap:8px;padding:10px 1px 8px;font-size:11px;cursor:pointer}.season-auto-toggle input{margin:0;accent-color:var(--a);width:14px;height:14px}
.season-interval-label{margin:1px 0 5px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.season-interval-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.season-interval-options button{height:29px;border:1px solid var(--line);border-radius:8px;background:var(--glass);color:var(--muted);font-size:10px;font-weight:750;cursor:pointer}.season-interval-options button:hover,.season-interval-options button[aria-pressed="true"]{border-color:var(--a);background:color-mix(in srgb,var(--a) 14%,var(--glass));color:var(--text)}
.seas{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--glass);}
.seas button{width:32px;height:28px;display:grid;place-items:center;border:0;border-radius:999px;background:none;color:var(--muted);transition:.25s}.seas button svg{width:16px;height:16px}
.seas button[data-k="0"]{--season-pill:#35a653}.seas button[data-k="1"]{--season-pill:#e4b91f}.seas button[data-k="2"]{--season-pill:#d76b27}.seas button[data-k="3"]{--season-pill:#4b9be8}.seas button:hover{color:var(--season-pill,var(--text))}.seas button.on{background:var(--season-pill,var(--a));color:#fff;box-shadow:0 0 0 1px color-mix(in srgb,var(--season-pill,var(--a)) 42%,transparent),0 0 14px color-mix(in srgb,var(--season-pill,var(--a)) 28%,transparent)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:46px;width:260px;max-height:min(72vh,540px);overflow:auto;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--s1);box-shadow:0 18px 44px rgb(0 0 0/.35)}
.menu h2{margin:4px 8px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.menu h2.gap{margin-top:12px}
.menu label{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}.menu label:hover{background:var(--s2)}
.menu input{accent-color:var(--a);width:16px;height:16px}
.menu .reset{width:100%;margin-top:6px;height:36px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--muted)}.menu .reset:hover{color:var(--text);border-color:var(--a)}

/* apps hanging from the canopy */
.fr{--h:var(--a);position:absolute;left:0;top:0;width:var(--w,98px);height:calc(var(--w,98px)*1.2);padding:0;border:0;background:none;transform-origin:0 0;pointer-events:auto;will-change:transform}
.in{position:absolute;inset:0;transform-origin:50% 0;transition:transform .3s ease}
.fr:hover .in,.fr-launch:focus-visible .in{transform:scale(1.05)}
.fr-launch{appearance:none;-webkit-appearance:none;position:absolute;inset:0;display:block;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent;color:inherit;text-align:inherit;overflow:visible;cursor:pointer}
.fr-launch:focus-visible{outline:2px solid var(--ff,#d6ff6b);outline-offset:2px;border-radius:12px}
.fr-star{position:absolute;z-index:6;left:4px;bottom:24px;display:grid;place-items:center;width:25px;height:25px;padding:0;border:1px solid color-mix(in srgb,var(--ff,#d6ff6b) 58%,transparent);border-radius:50%;background:rgb(5 14 10/.82);color:var(--ff,#d6ff6b);box-shadow:0 3px 9px rgb(0 0 0/.35);transition:transform .16s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;cursor:pointer}
.fr-star svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--ff,#d6ff6b) 38%,transparent))}
.fr-star:hover{transform:scale(1.12);border-color:var(--ff,#d6ff6b);box-shadow:0 0 12px color-mix(in srgb,var(--ff,#d6ff6b) 35%,transparent),0 3px 9px rgb(0 0 0/.35)}
.fr-star[aria-pressed="true"]{background:color-mix(in srgb,var(--ff,#d6ff6b) 24%,#07130c);border-color:var(--ff,#d6ff6b);box-shadow:0 0 13px color-mix(in srgb,var(--ff,#d6ff6b) 42%,transparent)}
.fr-star[aria-pressed="true"] svg path{fill:var(--ff,#d6ff6b);stroke:var(--ff,#d6ff6b)}
.fr-star:focus-visible{outline:2px solid var(--ff,#d6ff6b);outline-offset:3px}
.info{position:relative;padding-right:58px}
.art{position:absolute;inset:0;width:100%;height:100%;overflow:visible;stroke:none}
.wd{fill:#7b5235;stroke:#432b1a;stroke-width:2}.fr[data-h="1"]{--ff:#8aa8ff}.fr[data-h="2"]{--ff:#bf9dff}.fr[data-h="3"]{--ff:#ff8bb5}.fr[data-h="4"]{--ff:#ffb36b}.fr[data-h="5"]{--ff:#4fe0ac}.fr[data-h="6"]{--ff:#5ccfe0}.jb{fill:rgb(8 22 16/.4);stroke:none}.jg{fill:rgb(215 240 232/.13);stroke:rgb(238 252 246/.75);stroke-width:1.6}.jh{fill:rgb(255 255 255/.4)}.jl{fill:#9a7a3e;stroke:#4a3414;stroke-width:1.6}.jr{fill:none;stroke:#4a3414;stroke-width:1;opacity:.5}.jk{fill:#b48a58;stroke:#5a3d1e;stroke-width:1.6}.jw{fill:none;stroke:#cdb27c;stroke-width:2;stroke-linecap:round}.ffd{transform-box:fill-box;transform-origin:center;animation:ffb 2.6s ease-in-out infinite,ffm 7s ease-in-out infinite alternate}@keyframes ffb{0%,100%{opacity:.15}45%,60%{opacity:1}}@keyframes ffm{0%{transform:translate(-4px,3px)}50%{transform:translate(4px,-5px)}100%{transform:translate(-2px,4px)}}.lp{fill:color-mix(in srgb,var(--h) 38%,#fff1c9);stroke:#432b1a;stroke-width:1.6;opacity:.96}.lr{fill:none;stroke:color-mix(in srgb,var(--h) 55%,#432b1a);stroke-width:1.4;opacity:.55}.lf{fill:none;stroke:#d9b45a;stroke-width:2.4;stroke-linecap:round}.tz{fill:color-mix(in srgb,var(--h) 70%,#fff);stroke:none}.ln{stroke:#432b1a;stroke-width:2;fill:none}
.rp{stroke:var(--vine);stroke-width:3;fill:none;stroke-linecap:round}
.gl{fill:color-mix(in srgb,var(--h) 30%,rgb(255 255 255/.28));stroke:#ece6cc;stroke-width:2}
.fl{fill:color-mix(in srgb,var(--ff,#d6ff6b) 70%,#fff8c0);opacity:.3;transform-box:fill-box;transform-origin:center;animation:flick 2.4s ease-in-out infinite}@keyframes flick{50%{opacity:.5;transform:scale(.86)}}
.p1{fill:var(--e1)}.p2{fill:var(--e2)}.cap{fill:var(--e1)}.sp{fill:#fff;opacity:.85}.stem{fill:#efe6d0}.fr1{fill:var(--e2)}.hl{fill:rgb(255 255 255/.35)}.bd{fill:#2a2118}
.pet{transform-origin:50px 72px;animation:spin 40s linear infinite}
.wl,.wr{transform-box:fill-box;animation:flap .55s ease-in-out infinite alternate}.wl{transform-origin:100% 50%}.wr{transform-origin:0 50%}@keyframes flap{to{transform:scaleX(.3)}}
.cr{fill:color-mix(in srgb,var(--ff) 22%,#fff)}.bl{opacity:calc(.5 + var(--nt,0) * .5)}.cl{animation:cp 3.6s ease-in-out infinite}@keyframes cp{50%{opacity:.7}}
.ico{position:absolute;left:50%;top:var(--iy,50%);translate:-50% -50%;width:40%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:var(--ff,#d6ff6b);background:radial-gradient(closest-side,color-mix(in srgb,var(--ff,#d6ff6b) 30%,transparent),transparent 92%);animation:icp 3.4s ease-in-out infinite}.ico svg{width:60%;height:60%;stroke-width:2;filter:drop-shadow(0 0 3px var(--ff,#d6ff6b)) drop-shadow(0 0 9px var(--ff,#d6ff6b))}@keyframes icp{50%{opacity:.78}}
.nm{position:absolute;top:100%;left:50%;translate:-50% 4px;white-space:nowrap;font-weight:600;font-size:12px;color:#fff;text-shadow:0 1px 6px rgb(0 0 0/.8),0 0 2px #000;pointer-events:none}
.fr.main::before{content:"";position:absolute;left:50%;top:52%;width:170%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ff,#d6ff6b) 34%,transparent),transparent);animation:glowp 3.2s ease-in-out infinite;pointer-events:none}
@keyframes glowp{50%{opacity:.45;scale:.9}}

/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:0 clamp(14px,3vw,40px) 18px;pointer-events:none}
.dock>*{pointer-events:auto}
.card{border:1px solid var(--line);border-radius:26px;background:var(--glass);}
.info{display:flex;gap:16px;align-items:center;padding:16px 20px;width:min(440px,100%);border-color:color-mix(in srgb,var(--h) 45%,var(--line))}
.med{position:relative;flex:none;width:92px;height:92px;display:grid;place-items:center}
.med>svg{position:absolute;inset:0;width:100%;height:100%;stroke-width:1.2;color:var(--h)}.med .rt{transform-origin:46px 46px;animation:spin 22s linear infinite}
.mi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(140deg,var(--h),color-mix(in srgb,var(--h) 50%,#000));box-shadow:0 0 22px -4px var(--h)}.mi svg{width:26px;height:26px}
.rd{min-width:0;flex:1}
.badge{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;background:color-mix(in srgb,var(--h) 18%,transparent);color:var(--h);font-size:12px;font-weight:700}.badge svg{width:13px;height:13px;fill:currentColor;stroke:none}
.rd strong{display:block;margin-top:6px;font-size:25px;letter-spacing:-.03em;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.chips span{padding:2px 10px;border:1px solid color-mix(in srgb,var(--h) 40%,var(--line));border-radius:999px;font-size:12px;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:12px}
.open{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 18px;border:0;border-radius:999px;background:linear-gradient(140deg,var(--h),color-mix(in srgb,var(--h) 55%,#000));color:#fff;font-weight:700;box-shadow:0 12px 26px -12px var(--h);transition:.2s}
.open svg{width:17px;height:17px;transition:transform .2s}.open:hover svg{transform:translateX(4px)}
.sys{width:min(430px,100%);padding:16px 20px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}.sec-h span{display:flex;align-items:center;gap:8px}.hint{letter-spacing:0;text-transform:none;font-weight:400}
.sys-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.metric{display:grid;gap:3px}.mh{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:13px}.mh b{color:var(--text);font-size:24px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.metric small{color:var(--muted);font-size:12px}
.spark{width:100%;height:42px;overflow:visible}.spark .line{stroke:var(--c4);stroke-width:2;vector-effect:non-scaling-stroke}.spark .area{fill:color-mix(in srgb,var(--c4) 18%,transparent);stroke:none}
.ram .spark .line{stroke:var(--c6)}.ram .spark .area{fill:color-mix(in srgb,var(--c6) 18%,transparent)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);padding:10px 20px;border-radius:999px;background:var(--s2);border:1px solid var(--line);box-shadow:0 14px 40px rgb(0 0 0/.35);opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.top-r .hs{display:none}}
@media(max-width:899px){.info,.sys{width:100%}.top{grid-template-columns:minmax(0,1fr) auto}}
@media(max-width:560px){.chgm .lbl{display:none}.med{width:70px;height:70px}.mi{width:44px;height:44px}.rd strong{font-size:20px}.seas button{width:28px}}
@media(prefers-reduced-motion:reduce){.pet,.wl,.wr,.fl,.fr.main::before,.mark svg,.med .rt,.dot{animation:none!important}}
.reduce-motion .pet,.reduce-motion .wl,.reduce-motion .wr,.reduce-motion .ffd,.reduce-motion .ico{animation:none!important}@media(prefers-reduced-motion:reduce){.ffd,.ico{animation:none!important}}


/* ===== Quick Access trigger: same size and skin as the neighbouring icon buttons ===== */
body[data-home-style="parallax-jungle"] .madstation-theme-quick-access .madstation-theme-quick-trigger{appearance:none;-webkit-appearance:none;box-sizing:border-box;width:38px;height:38px;min-width:38px;min-height:38px;flex:0 0 38px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--glass);color:var(--muted);box-shadow:none}
body[data-home-style="parallax-jungle"] .madstation-theme-quick-access .madstation-theme-quick-trigger:hover{border-color:var(--a);color:var(--text);border-radius:12px;box-shadow:none}

/* ===== Audit fit pass (Jungle): brand contrast, side-by-side bottom cards at the 900px minimum, equal card heights, compact short windows ===== */
.brand b{color:color-mix(in srgb,var(--a) 30%,#fff);text-shadow:0 1px 3px rgb(0 24 12/.8),0 0 14px rgb(0 24 12/.65)}
.brand .mark{color:color-mix(in srgb,var(--a) 30%,#fff)}
.brand .mark svg{filter:drop-shadow(0 1px 3px rgb(0 24 12/.8)) drop-shadow(0 0 8px var(--a))}
.brand>span:last-child{text-shadow:0 1px 3px rgb(0 24 12/.8),0 0 14px rgb(0 24 12/.55)}
@media(min-width:900px){
  .dock{align-items:stretch}
  .sys{display:flex;flex-direction:column;justify-content:center}
  .sys .sec-h{margin-bottom:8px}
}
@media(min-width:900px) and (max-width:1000px){
  .top{grid-template-columns:auto minmax(160px,270px) 1fr}.top-r{flex-wrap:nowrap}
  .info{width:min(440px,calc(50% - 8px))}
  .sys{width:min(430px,calc(50% - 8px))}
  .sys-grid{gap:14px}
}
@media(min-width:900px) and (max-height:720px){
  .dock{padding-bottom:12px;gap:12px}
  .info{padding:10px 16px;gap:12px}.sys{padding:10px 16px}
  .med{width:72px;height:72px}.mi{width:44px;height:44px}.mi svg{width:21px;height:21px}
  .rd strong{font-size:21px;margin-top:3px}
  .chips{margin-top:4px}.acts{margin-top:8px}
  .open{height:32px}
  .sec-h{margin-bottom:4px}
  .spark{height:30px}.mh b{font-size:20px}
}

/* Theme-matched process-monitor refresh control. */
.sys-head-actions { display:inline-flex; align-items:center; gap:9px; min-width:0; }
.sys-refresh-btn { flex:none; display:inline-grid; place-items:center; width:29px; height:29px; padding:0; border:1px solid color-mix(in srgb,var(--ph,var(--a,var(--accent))) 45%,var(--line)); border-radius:50% 50% 44% 56%; background:linear-gradient(145deg,color-mix(in srgb,var(--ph,var(--a,var(--accent))) 20%,var(--panel)),color-mix(in srgb,var(--ph,var(--a,var(--accent))) 7%,var(--bg))); color:var(--ph,var(--a,var(--accent))); box-shadow:0 4px 12px #0004,inset 0 1px 0 #ffffff26; transition:transform .25s,box-shadow .25s; }
.sys-refresh-btn svg { width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; transition:transform .48s; }
.sys-refresh-btn:hover { transform:translateY(-1px) rotate(-5deg); box-shadow:0 7px 16px #0005,0 0 12px color-mix(in srgb,var(--ph,var(--a,var(--accent))) 20%,transparent); }
.sys-refresh-btn.is-refreshing svg { transform:rotate(360deg); }

/* Keyboard focus remains visible even though the input itself has a reset outline. */

<script>
/* Mad Station host bridge for the Parallax Jungle homepage. */
(function () {
  'use strict';
  const CHANNEL = 'madstation-home-parallax-jungle';
  const isFramed = window.parent !== window;
  const allowedMemoryActions = new Set(['refresh', 'cleanup', 'details']);
  let ready = false;

  function sendHost(type, detail = {}) {
    if (!isFramed) return false;
    try { window.parent.postMessage({ channel: CHANNEL, type, ...detail }, '*'); return true; }
    catch { return false; }
  }

  window.MadHomeApps?.setLauncher?.((target) => {
    if (typeof target === 'string' && target.length <= 80) sendHost('launch', { target });
  });
  if (window.MadHome) {
    window.MadHome.inApp = isFramed || Boolean(window.MadStationMemoryMonitor);
    window.MadHome.toggleTheme = () => sendHost('toggle-theme');
    window.MadHome.memoryAction = (action) => { if (allowedMemoryActions.has(action)) sendHost('memory-action', { action }); };
  }
  document.getElementById('launcherSettingsBtn')?.addEventListener('click', () => sendHost('open-settings'));
  // When embedded, the host remains authoritative for the shared theme preference.
  document.getElementById('themeBtn')?.addEventListener('click', (event) => {
    if (!isFramed) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    sendHost('toggle-theme');
  }, true);

  function applySettings(settings) {
    if (!settings || typeof settings !== 'object' || Array.isArray(settings)) return;
    const requestedTheme = ['dark', 'light', 'system'].includes(settings.theme) ? settings.theme : document.body.dataset.theme;
    const systemLight = Boolean(window.matchMedia?.('(prefers-color-scheme: light)').matches);
    const resolvedTheme = requestedTheme === 'system' ? (systemLight ? 'light' : 'dark') : requestedTheme;
    document.body.dataset.theme = resolvedTheme;
    // Synchronize the Jungle's animated canvas lighting with host Appearance.
    window.MadHome?.setTheme?.(resolvedTheme);
    document.body.classList.toggle('reduce-motion', Boolean(settings.reduceMotion));
    window.MadHome?.setStats?.({ accounts: Number(settings.accounts) || 0, providers: Number(settings.providers) || 0 });
  }

  window.addEventListener('message', (event) => {
    if (!isFramed || event.source !== window.parent || event.data?.channel !== CHANNEL) return;
    const message = event.data;
    if (!message || typeof message.type !== 'string') return;
    if (message.type === 'host-ping') {
      if (ready) sendHost('home-ready');
    } else if (message.type === 'appearance-settings') {
      applySettings(message.settings);
    } else if (message.type === 'memory-model' && message.model && typeof message.model === 'object' && !Array.isArray(message.model)) {
      document.dispatchEvent(new CustomEvent('mad:memory-model', { detail: message.model }));
    } else if (message.type === 'stats') {
      window.MadHome?.setStats?.({ accounts: message.accounts, providers: message.providers });
    }
  });
  window.addEventListener('error', () => { if (!ready) sendHost('home-error'); });
  window.addEventListener('unhandledrejection', () => { if (!ready) sendHost('home-error'); });
  function markReady() { ready = true; sendHost('home-ready'); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', markReady, { once: true });
  else queueMicrotask(markReady);
})();
</script>
