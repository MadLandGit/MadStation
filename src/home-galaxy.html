<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"/>
<link href="developer-visual-debug.css" rel="stylesheet"/>
<title>Galaxy — Mad Station</title>
<style>
body{--bg:#02030a;--s1:#0d121c;--s2:#161d2b;--line:#252f45;--text:#eef2fb;--muted:#8d99b0;--a:#8fb4ff;--c1:#7c9cff;--c2:#b18cff;--c3:#ff8bb5;--c4:#ffb36b;--c5:#4fd8a4;--c6:#5ccfe0;--hud:'Segoe UI Variable Display','SF Pro Display',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
body[data-theme=light]{--bg:#111b30;--s1:#f5f7ff;--s2:#e8eefb;--line:#bfcee8;--text:#121a2c;--muted:#59667d;--a:#8eacff}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
h2,p,ul{margin:0;padding:0}ul{list-style:none}
[data-h="1"]{--h:var(--c1)}[data-h="2"]{--h:var(--c2)}[data-h="3"]{--h:var(--c3)}[data-h="4"]{--h:var(--c4)}[data-h="5"]{--h:var(--c5)}[data-h="6"]{--h:var(--c6)}
#sky{position:fixed;inset:0;width:100%;height:100%}
.neb{position:fixed;inset:-6%;pointer-events:none;will-change:transform;animation:breathe 20s ease-in-out infinite alternate;background:radial-gradient(60% 50% at 50% 52%,rgb(255 170 100/.07),transparent 70%),radial-gradient(45% 40% at 14% 18%,rgb(70 80 190/.11),transparent 70%),radial-gradient(40% 40% at 88% 80%,rgb(150 70 120/.07),transparent 70%)}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 100% at 50% 46%,transparent 55%,rgb(0 0 0/.5))}body[data-theme=light] .vig{opacity:.12}
body[data-theme=light] .neb{opacity:.66;animation:none}@keyframes breathe{from{opacity:.7}to{opacity:1}}
.home{position:fixed;inset:0}
#world{position:absolute;inset:0;pointer-events:none;z-index:10}
.brand{position:absolute;left:clamp(14px,3vw,40px);top:18px;z-index:30;display:flex;align-items:center;gap:10px;font:600 17px var(--hud);letter-spacing:-.005em}
.brand b{font-weight:600;color:var(--a)}.mark{width:30px;height:30px;color:var(--a)}.mark svg{width:30px;height:30px}
.orbit-speed{position:absolute;left:50%;top:calc(var(--home-window-chrome-height,42px) + 7px);z-index:31;transform:translateX(-50%);width:286px;min-width:250px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid rgb(255 255 255/.12);border-radius:999px;background:rgb(14 20 34/.58);backdrop-filter:blur(15px) saturate(1.25);box-shadow:0 8px 26px rgb(0 0 0/.16),inset 0 1px rgb(255 255 255/.055);color:#b9c5de;font:600 11px var(--hud)}
.orbit-speed label{white-space:nowrap;text-transform:uppercase;letter-spacing:.055em;font-size:10px;color:#bdc9e1}
.orbit-speed input[type="range"]{width:100px;min-width:48px;flex:1;margin:0;accent-color:#93b5ff;cursor:pointer}
.orbit-speed output{min-width:34px;text-align:right;font:600 11px var(--hud);font-variant-numeric:tabular-nums;color:#eef3ff}
.orbit-speed input[type="range"]:focus-visible{outline:2px solid var(--a);outline-offset:4px}
body[data-theme=light] .orbit-speed{border-color:rgb(54 71 112/.2);background:rgb(255 255 255/.78);color:#34405a;box-shadow:0 8px 24px rgb(25 36 70/.12),inset 0 1px #fff}
body[data-theme=light] .orbit-speed label{color:#46536f}body[data-theme=light] .orbit-speed output{color:#1e2a49}
@media(max-width:640px){.orbit-speed{width:min(230px,calc(100vw - 190px));min-width:150px;gap:6px;padding:6px 8px}.orbit-speed label{font-size:9px;letter-spacing:.025em}.orbit-speed input[type="range"]{min-width:38px;width:68px}}
@media(max-width:430px){.orbit-speed{width:124px;min-width:124px;gap:6px;padding:6px 8px}.orbit-speed label{display:none}.orbit-speed input[type="range"]{width:72px;min-width:55px}.orbit-speed output{min-width:30px;font-size:10px}}

/* hit targets */
.pl,.sunbtn{position:absolute;left:0;top:0;padding:0;border:0;border-radius:50%;background:none;pointer-events:auto}
.pl{--h:var(--a);width:var(--s,48px);height:var(--s,48px)}
.nm{position:absolute;top:100%;left:50%;translate:-50% 6px;white-space:nowrap;font:500 12px var(--hud);color:rgb(235 241 255/.82);pointer-events:none;text-shadow:0 1px 8px rgb(0 0 0/.9),0 0 16px var(--bg)}.pl.main .nm{font-weight:600;color:#fff}body[data-theme=light] .nm{color:rgba(235,241,255,.94);text-shadow:0 1px 8px rgb(0 0 0/.92),0 0 16px var(--bg)}
.ib{position:absolute;right:-4px;bottom:-2px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--h);background:rgb(8 12 22/.82);border:1px solid color-mix(in srgb,var(--h) 55%,transparent)}.ib svg{width:11px;height:11px;stroke-width:2}
.pl.main::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid color-mix(in srgb,var(--h) 45%,transparent)}
@keyframes spin{to{rotate:360deg}}@keyframes halo{from{transform:scale(1);opacity:.6}to{transform:scale(2);opacity:0}}
.sunbtn{display:grid;place-items:center;color:#fff;transition:box-shadow .3s}
.sunbtn svg{width:30px;height:30px;opacity:0;transition:opacity .3s,rotate 1.2s;filter:drop-shadow(0 0 8px #000)}
.sunbtn:hover svg,.sunbtn:focus-visible svg{opacity:.95;rotate:180deg}
.sunbtn:hover,.sunbtn:focus-visible{box-shadow:0 0 0 1.5px rgb(255 220 160/.7),0 0 0 9px rgb(255 200 120/.1)}

/* dock panels */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:0 clamp(14px,3vw,40px) 20px;pointer-events:none}
.dock>*{pointer-events:auto}
.pan{--pm:#93a0ba;position:relative;font-family:var(--hud);color:#e9eefb;padding:16px 18px;border-radius:18px;border:1px solid rgb(255 255 255/.08);background:linear-gradient(180deg,rgb(18 24 40/.58),rgb(7 10 18/.7));backdrop-filter:blur(18px) saturate(1.2);box-shadow:0 18px 50px rgb(0 0 0/.35),inset 0 1px 0 rgb(255 255 255/.05)}
.info{--h:var(--a);display:flex;gap:18px;align-items:center;width:min(440px,100%);border-color:color-mix(in srgb,var(--h) 28%,rgb(255 255 255/.08))}
body [data-h="1"]{--h:var(--c1)}body [data-h="2"]{--h:var(--c2)}body [data-h="3"]{--h:var(--c3)}body [data-h="4"]{--h:var(--c4)}body [data-h="5"]{--h:var(--c5)}body [data-h="6"]{--h:var(--c6)}
.ret{position:relative;flex:none;width:92px;height:92px;display:grid;place-items:center}
.ret::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid color-mix(in srgb,var(--h) 35%,transparent);box-shadow:0 0 28px color-mix(in srgb,var(--h) 22%,transparent)}
.ret canvas{width:84px;height:84px;border-radius:50%}
.gear{position:absolute;width:40px;height:40px;color:#ffd9a0}
.rd{min-width:0;flex:1}
.st{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--pm)}
.st i{width:6px;height:6px;border-radius:50%;background:var(--h)}
.st kbd{margin-left:auto;font-size:11px;padding:0 7px;border-color:rgb(255 255 255/.14);color:var(--pm)}
.rd strong{display:block;margin:5px 0 8px;font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{padding:2px 10px;border-radius:99px;background:rgb(255 255 255/.06);border:1px solid rgb(255 255 255/.07);font-size:12px;color:#c9d6f0}
.acts{display:flex;gap:8px;margin-top:14px}
.open{height:36px;padding:0 16px;border:0;border-radius:10px;display:inline-flex;align-items:center;gap:8px;font:600 13.5px var(--hud);color:#06101f;background:var(--h);transition:filter .2s,transform .2s}
.open:hover{filter:brightness(1.1)}.open:active{transform:scale(.97)}.open svg{width:16px;height:16px;stroke-width:2.2}
.mk{height:36px;padding:0 14px;border-radius:10px;border:1px solid rgb(255 255 255/.14);background:none;font:500 13px var(--hud);color:#c3cee6;transition:background .2s,color .2s}.mk:hover{background:rgb(255 255 255/.07);color:#fff}
 .cons{--h:#5ccfe0;width:min(330px,100%);padding:10px 14px 12px}
.cons-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:26px;margin-bottom:4px;color:var(--pm);font:600 11px var(--hud);letter-spacing:.09em;text-transform:uppercase}
.dials{display:flex;gap:12px;justify-content:center;align-items:center}
.dial{width:calc(50% - 6px);max-width:122px;height:auto;overflow:visible;stroke-width:1}
.dial .bz{fill:rgb(5 8 16/.7);stroke:rgb(255 255 255/.1);stroke-width:1.5}.dial .bz2{fill:none;stroke:rgb(255 255 255/.06)}
.dial .trk{fill:none;stroke:rgb(255 255 255/.07);stroke-width:6;stroke-linecap:round}.dial .fl{fill:none;stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 4px currentColor)}
.dial .tn{stroke:rgb(255 255 255/.18)}.dial .tm{stroke:rgb(255 255 255/.42);stroke-width:1.4}
.dial .tl{fill:#8794ad;font:500 8px var(--hud);text-anchor:middle;stroke:none}
.dial .dv{fill:#fff;font:600 15px var(--hud);text-anchor:middle;stroke:none}.dial .dn{fill:#8794ad;font:500 8.5px var(--hud);text-anchor:middle;stroke:none}
.dial .nd{fill:#ffd9a0;stroke:none}.dial .hb{fill:#141b2c;stroke:rgb(255 255 255/.25);stroke-width:1.2}.dial .hb2{fill:#ffd9a0;stroke:none}
kbd{border:1px solid var(--line);border-radius:7px;padding:1px 8px;font:600 11px/1.6 var(--hud);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);padding:10px 20px;border-radius:999px;background:var(--s2);border:1px solid var(--line);opacity:0;pointer-events:none;transition:.25s;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:899px){.cons,.info{width:100%}}
@media(max-width:560px){.ret{width:72px;height:72px}.ret canvas{width:64px;height:64px}.rd strong{font-size:20px}.nm{font-size:10.5px}}
@media(prefers-reduced-motion:reduce){.neb{animation:none}.pl::before,.pl::after,.ret .rot,.ret .rot2,.st i{animation:none!important}}
.reduce-motion .pl::before,.reduce-motion .pl::after,.reduce-motion .rot,.reduce-motion .rot2{animation:none!important}


/* ===== Audit fit pass (Galaxy): panels sit side by side at the 900px minimum and compact on short windows; the orbit area is reserved above them ===== */
@media(min-width:900px) and (max-width:1100px){.info{width:min(420px,46vw)}.cons{width:min(330px,46vw)}}
@media(min-width:900px) and (max-height:720px){
  .dock{padding-bottom:12px;gap:12px}
  .pan{padding:10px 14px;border-radius:16px}
  .ret{width:72px;height:72px}.ret canvas{width:64px;height:64px}
  .info{gap:14px}
  .rd strong{font-size:20px;margin:3px 0 6px}
  .acts{margin-top:8px}.open,.mk{height:30px}
  .dial{max-width:104px}
}

/* Theme-matched process-monitor refresh control. */
.cons-head .sys-refresh-btn { flex:none; display:inline-grid; place-items:center; width:26px; height:26px; padding:0; border:1px solid color-mix(in srgb,var(--a) 55%,var(--line)); border-radius:50%; background:radial-gradient(circle at 30% 25%,rgb(255 255 255/.12),transparent 55%),rgb(10 18 36/.8); color:var(--c6); box-shadow:0 0 12px color-mix(in srgb,var(--c6) 18%,transparent),inset 0 1px 0 rgb(255 255 255/.08); transition:border-color .2s,box-shadow .2s,transform .15s; }
.cons-head .sys-refresh-btn svg { width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; transition:transform .48s; }
.cons-head .sys-refresh-btn:hover { border-color:var(--c6); box-shadow:0 0 18px color-mix(in srgb,var(--c6) 32%,transparent); }
.cons-head .sys-refresh-btn:active { transform:scale(.92); }
.cons-head .sys-refresh-btn.is-refreshing svg { transform:rotate(360deg); }

/* Galaxy Day mode stays cosmic; keep the station identity crisp against the brighter nebula. */
body[data-theme="light"] .brand { color: #f2f6ff; text-shadow: 0 2px 12px rgb(3 8 22 / .82); }
body[data-theme="light"] .brand .mark { color: #a9c7ff; filter: drop-shadow(0 0 8px rgb(113 160 255 / .55)); }
body[data-theme="light"] .brand b { color: #ffffff; }

<script>
/* Mad Station host bridge for the Galaxy homepage. */
(function () {
  'use strict';
  const CHANNEL = 'madstation-home-galaxy';
  const isFramed = window.parent !== window;
  const allowedMemoryActions = new Set(['refresh', 'cleanup', 'details']);
  let ready = false;

  function sendHost(type, detail = {}) {
    if (!isFramed) return false;
    try { window.parent.postMessage({ channel: CHANNEL, type, ...detail }, '*'); return true; }
    catch { return false; }
  }

  window.MadHomeApps?.setLauncher?.((target) => {
    if (typeof target === 'string' && target.length <= 80) sendHost('launch', { target });
  });
  if (window.MadHome) {
    window.MadHome.inApp = isFramed || Boolean(window.MadStationMemoryMonitor);
    window.MadHome.toggleTheme = () => sendHost('toggle-theme');
    window.MadHome.memoryAction = (action) => { if (allowedMemoryActions.has(action)) sendHost('memory-action', { action }); };
  }
  document.getElementById('launcherSettingsBtn')?.addEventListener('click', () => sendHost('open-settings'));

  function applySettings(settings) {
    if (!settings || typeof settings !== 'object' || Array.isArray(settings)) return;
    const requestedTheme = ['dark', 'light', 'system'].includes(settings.theme) ? settings.theme : document.body.dataset.theme;
    const systemLight = Boolean(window.matchMedia?.('(prefers-color-scheme: light)').matches);
    document.body.dataset.theme = requestedTheme === 'system' ? (systemLight ? 'light' : 'dark') : requestedTheme;
    document.body.classList.toggle('reduce-motion', Boolean(settings.reduceMotion));
    window.MadHome?.setStats?.({ accounts: Number(settings.accounts) || 0, providers: Number(settings.providers) || 0 });
  }

  window.addEventListener('message', (event) => {
    if (!isFramed || event.source !== window.parent || event.data?.channel !== CHANNEL) return;
    const message = event.data;
    if (!message || typeof message.type !== 'string') return;
    if (message.type === 'host-ping') {
      if (ready) sendHost('home-ready');
    } else if (message.type === 'appearance-settings') {
      applySettings(message.settings);
    } else if (message.type === 'memory-model' && message.model && typeof message.model === 'object' && !Array.isArray(message.model)) {
      document.dispatchEvent(new CustomEvent('mad:memory-model', { detail: message.model }));
    } else if (message.type === 'stats') {
      window.MadHome?.setStats?.({ accounts: message.accounts, providers: message.providers });
    }
  });
  window.addEventListener('error', () => { if (!ready) sendHost('home-error'); });
  window.addEventListener('unhandledrejection', () => { if (!ready) sendHost('home-error'); });
  function markReady() { ready = true; sendHost('home-ready'); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', markReady, { once: true });
  else queueMicrotask(markReady);
})();
</script>
