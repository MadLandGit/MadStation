<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"/>
<link href="developer-visual-debug.css" rel="stylesheet"/>
<title>Glass — Mad Station</title>
<style>
/* Mad Station — Home v10 "Glass". Frosted panes over a living light field. Same features and host hooks as v9. CSP-safe. */
@property --mh{syntax:'<color>';inherits:true;initial-value:#6f8cff}
body{
  --a:var(--accent,#7c9cff);--c1:#7c9cff;--c2:#b18cff;--c3:#ff8fbd;--c4:#ffb869;--c5:#4fe0b0;--c6:#4fd0ee;
  --text:#f5f7ff;--muted:#b3bbe4;--bg:linear-gradient(160deg,#0b0d2b,#1b1050 48%,#08284a);
  --ga:rgb(255 255 255/.17);--gb:rgb(255 255 255/.04);--edge:rgb(255 255 255/.22);--hi:rgb(255 255 255/.38);--shadow:rgb(2 4 30/.55);--field:rgb(255 255 255/.08);
  --blur:blur(26px) saturate(170%);--ease:cubic-bezier(.2,.85,.25,1);color-scheme:dark}
body[data-theme=light]{
  --text:#1b2152;--muted:#566096;--bg:linear-gradient(160deg,#dbe5ff,#efe0ff 50%,#d4f2ff);
  --ga:rgb(255 255 255/.62);--gb:rgb(255 255 255/.22);--edge:rgb(255 255 255/.85);--hi:rgb(255 255 255/.95);--shadow:rgb(70 82 170/.28);--field:rgb(255 255 255/.5);color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.45 'Segoe UI Variable Display','SF Pro Display','Inter','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid color-mix(in srgb,var(--a) 80%,#fff);outline-offset:3px}
h1,h2,p,ul{margin:0;padding:0}ul{list-style:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}
[data-h="1"]{--h:var(--c1)}[data-h="2"]{--h:var(--c2)}[data-h="3"]{--h:var(--c3)}[data-h="4"]{--h:var(--c4)}[data-h="5"]{--h:var(--c5)}[data-h="6"]{--h:var(--c6)}

/* ---- depth layers: light field → spot → glass gems → content ---- */
.layers{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.8;translate:var(--tx,0) var(--ty,0);animation:drift 22s ease-in-out infinite alternate}
.o1{width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:var(--mh);transition:--mh .8s}
.o2{width:36vmax;height:36vmax;right:-10vmax;top:6vmax;background:var(--c3);opacity:.55;animation-duration:28s}
.o3{width:40vmax;height:40vmax;left:22vw;bottom:-22vmax;background:var(--c6);opacity:.5;animation-duration:25s}
.o4{width:26vmax;height:26vmax;right:12vw;bottom:2vmax;background:var(--c2);opacity:.5;animation-duration:31s}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.12)}}
.gem{position:absolute;border-radius:50%;border:1px solid var(--edge);background:linear-gradient(135deg,var(--ga),var(--gb));backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 var(--hi),0 30px 60px -30px var(--shadow);translate:var(--tx,0) var(--ty,0)}
.g1{width:230px;height:230px;left:5vw;top:40vh}.g2{width:130px;height:130px;right:9vw;top:20vh}.g3{width:300px;height:300px;right:-90px;bottom:-60px}

/* ---- the glass material ---- */
.glass{position:relative;background:linear-gradient(135deg,var(--ga),var(--gb));backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--edge);border-radius:26px;box-shadow:0 24px 60px -24px var(--shadow),inset 0 1px 0 var(--hi),inset 0 -1px 0 rgb(255 255 255/.06)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--gx,25%) var(--gy,0%),rgb(255 255 255/.22),transparent 55%);opacity:0;transition:opacity .35s}
.glass:hover::before,.glass:focus-visible::before{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(14px)}}
.rise{animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms)}

/* ---- home layout ---- */
.home{position:fixed;inset:0;z-index:1;overflow:auto;padding:18px clamp(14px,3vw,40px) 48px;scrollbar-width:thin}
.top{max-width:1240px;margin:0 auto 26px;position:sticky;top:0;z-index:20}
.dock{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:300;letter-spacing:.02em;white-space:nowrap}.brand b{font-weight:700}
.mark{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--c2));box-shadow:inset 0 1px 0 var(--hi),0 8px 20px -8px var(--a);color:#fff}
.mark svg{width:20px;height:20px}
kbd{font:600 11px/1 inherit;padding:4px 7px;border-radius:7px;background:var(--field);border:1px solid var(--edge);color:var(--muted)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip,.chgm,.icon{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;background:var(--field);border:1px solid var(--edge);color:var(--text);font-size:13px;transition:background .25s,transform .25s var(--ease)}
.chgm:hover,.icon:hover{background:var(--ga);transform:translateY(-1px)}
.chgm svg,.icon svg{width:17px;height:17px}.icon{width:36px;padding:0;justify-content:center}
.chip em{font-style:normal;animation:blink 1.2s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
.chip b{font-weight:600;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c5);box-shadow:0 0 10px var(--c5);display:inline-block}
.bar{width:36px;height:5px;border-radius:9px;background:var(--field);overflow:hidden;display:block}.bar u{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--c6),var(--c2));transition:width .6s}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:250px;padding:14px;border-radius:22px;z-index:30;animation:rise .35s var(--ease);background:linear-gradient(135deg,var(--ga),var(--gb)),rgb(20 20 50/.35)}
body[data-theme=light] .menu{background:linear-gradient(135deg,var(--ga),var(--gb)),rgb(255 255 255/.5)}
.menu h2{font-size:12px;font-weight:600;color:var(--muted);margin:2px 4px 6px}.menu h2.gap{margin-top:12px}
.menu label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px;cursor:pointer;transition:background .2s}
.menu label:hover{background:var(--field)}.menu input{accent-color:var(--a);width:16px;height:16px;margin:0}
.reset{margin-top:10px;width:100%;padding:9px;border-radius:12px;background:var(--field);border:1px solid var(--edge);font-weight:600}.reset:hover{background:var(--ga)}

.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr);gap:22px;align-items:stretch}
.hello{grid-column:1/-1;padding:4px 8px 2px}
.hello h1{font-size:clamp(32px,5vw,56px);font-weight:200;letter-spacing:-.02em;line-height:1.1}
.hello h1 span{display:inline-block;animation:rise .9s var(--ease) backwards;animation-delay:calc(var(--i)*35ms + 150ms)}
.hello p{color:var(--muted);font-size:16px;margin-top:6px;font-weight:300}
.stage{perspective:1200px;min-width:0}

/* main app hero */
.main{height:100%;min-height:340px;padding:26px 30px;display:flex;flex-direction:column;cursor:pointer;border-radius:34px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s var(--ease);overflow:hidden}
.main::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(90% 120% at 100% 100%,color-mix(in srgb,var(--h) 42%,transparent),transparent 62%)}
.main.drop{outline:3px dashed var(--h);outline-offset:7px;box-shadow:0 0 0 6px color-mix(in srgb,var(--h) 14%,transparent),0 30px 72px -24px var(--h)}
.main>*{position:relative;z-index:1}
.m-bar{display:flex;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--field);border:1px solid var(--edge);font-size:12px;font-weight:600}.badge svg{width:14px;height:14px}
.m-st{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.m-bar .key{margin-left:auto}
.key{font-size:11px;font-weight:600;color:var(--muted);min-width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--field);border:1px solid var(--edge)}
.m-body{flex:1;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:12px}
.m-txt{min-width:0}
.m-name{display:block;font-size:clamp(38px,6vw,76px);font-weight:200;letter-spacing:-.03em;line-height:1.02}
.m-name span{display:inline-block;animation:rise .8s var(--ease) backwards;animation-delay:calc(var(--i)*28ms)}
.fcs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 22px}
.fc{padding:6px 13px;border-radius:999px;font-size:13px;background:var(--field);border:1px solid var(--edge);animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.open{display:inline-flex;align-items:center;gap:10px;padding:13px 22px;border-radius:999px;font-weight:600;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--h) 85%,#fff),color-mix(in srgb,var(--h) 70%,#3a2a9a));border:1px solid rgb(255 255 255/.45);box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 14px 30px -12px var(--h);transition:transform .3s var(--ease),box-shadow .3s}
.open:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 20px 36px -12px var(--h)}.open svg{width:18px;height:18px;transition:transform .3s var(--ease)}.open:hover svg{transform:translateX(4px)}
.m-orb{flex:none;width:min(240px,32vw);aspect-ratio:1;display:grid;place-items:center;position:relative;translate:calc(var(--dx,0)*14px) calc(var(--dy,0)*14px)}
.m-orb .ring{position:absolute;border-radius:50%;border:1px solid var(--edge);background:linear-gradient(135deg,var(--ga),var(--gb));backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 var(--hi)}
.r1{inset:0;animation:spin 26s linear infinite;border-style:dashed!important}.r2{inset:14%}
@keyframes spin{to{transform:rotate(360deg)}}
.m-orb .ico{position:relative;width:46%;aspect-ratio:1;border-radius:32%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--h) 80%,#fff),var(--h));border:1px solid rgb(255 255 255/.55);box-shadow:inset 0 2px 0 rgb(255 255 255/.55),0 24px 50px -16px var(--h);translate:calc(var(--dx,0)*10px) calc(var(--dy,0)*10px)}
.m-orb .ico svg{width:52%;height:52%;stroke-width:1.5}

/* live system */
.sys{padding:22px;display:flex;flex-direction:column;gap:14px;border-radius:30px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.sec-h h2{font-size:17px;font-weight:600;display:flex;align-items:center;gap:9px}.hint{color:var(--muted);font-size:12px}
.pn{padding:16px;border-radius:20px;background:var(--field);border:1px solid var(--edge);display:flex;flex-direction:column;gap:10px;flex:1}
.pn-top{display:flex;align-items:center;gap:14px}
.gauge{position:relative;width:70px;height:70px;flex:none}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg);stroke-width:4.5}
.gauge .trk{stroke:var(--edge)}.gauge .val{stroke:var(--h);stroke-dasharray:0 100;transition:stroke-dasharray .8s var(--ease);filter:drop-shadow(0 0 4px var(--h))}
.gauge b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:600}
.pn-txt{display:flex;flex-direction:column;min-width:0}.pn-txt .lbl{font-size:12px;color:var(--muted)}.pn-txt>b{font-size:22px;font-weight:300}.pn-txt small{color:var(--muted);font-size:12px}
.spark{width:100%;height:42px}.spark .line{stroke:var(--h);stroke-width:2}.spark .area{fill:color-mix(in srgb,var(--h) 22%,transparent);stroke:none}

/* more apps */
.rail{grid-column:1/-1;margin-top:8px}
.rail .sec-h{padding:0 8px;margin-bottom:14px}.rail .sec-h h2{font-weight:300;font-size:24px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;perspective:1200px}
.tile{padding:20px;min-height:168px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s var(--ease),border-color .3s;touch-action:manipulation}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(110% 90% at 0 0,color-mix(in srgb,var(--h) 34%,transparent),transparent 62%);opacity:.8;transition:opacity .3s}
.tile:hover{border-color:var(--hi)}.tile:hover::after{opacity:1}.tile>*{position:relative;z-index:1}
.tile .ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:#fff;margin-bottom:auto;background:linear-gradient(135deg,color-mix(in srgb,var(--h) 78%,#fff),var(--h));border:1px solid rgb(255 255 255/.5);box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 12px 24px -10px var(--h);transition:transform .4s var(--ease);translate:calc(var(--dx,0)*5px) calc(var(--dy,0)*5px)}
.tile:hover .ico{transform:scale(1.1) rotate(-5deg)}.tile .ico svg{width:24px;height:24px}
.tile strong{font-size:17px;font-weight:600}.tile .tag{color:var(--muted);font-size:12.5px}
.tile .key{position:absolute;right:16px;bottom:16px}
.star{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--field);border:1px solid var(--edge);opacity:0;transform:scale(.8);transition:opacity .25s,transform .3s var(--ease),color .2s}
.tile:hover .star,.star:focus-visible{opacity:1;transform:none}.star:hover{color:var(--c4)}.star svg{width:16px;height:16px}
.tile.lifted{opacity:.2}.ghost{position:fixed;left:0;top:0;z-index:70;pointer-events:none;margin:0;box-shadow:0 40px 80px -20px var(--shadow),inset 0 1px 0 var(--hi)}
.none{padding:30px;text-align:center;color:var(--muted)}

/* palette + toast */@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;z-index:60;transform:translate(-50%,24px);opacity:0;pointer-events:none;padding:11px 20px;border-radius:999px;background:linear-gradient(135deg,var(--ga),var(--gb)),rgb(20 22 60/.45);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:0 20px 40px -16px var(--shadow),inset 0 1px 0 var(--hi);transition:opacity .3s,transform .4s var(--ease)}
body[data-theme=light] .toast{background:linear-gradient(135deg,var(--ga),var(--gb)),rgb(255 255 255/.6)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){.layout{grid-template-columns:1fr}.hide-s,.chgm .lbl{display:none}.m-orb{display:none}}
@media (max-width:560px){.brand span:last-child{display:none}.dock{padding:8px}.main{padding:20px}}
@media (prefers-reduced-motion:reduce),(prefers-reduced-motion:no-preference){body.reduce-motion *{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}

/* ---- v11: deeper glass, richer background, per-app 3D scenes ---- */
.o5{width:30vmax;height:30vmax;left:40vw;top:-16vmax;background:var(--c4);opacity:.4;animation-duration:34s}
.o6{width:34vmax;height:34vmax;left:-14vmax;bottom:-10vmax;background:var(--c5);opacity:.4;animation-duration:27s}
@keyframes flt{to{transform:translateY(-28px) rotate(8deg)}}
.gem{animation:flt 10s ease-in-out infinite alternate}
.sph,.cap,.tor{position:absolute;width:var(--s);translate:var(--tx,0) var(--ty,0);backdrop-filter:blur(4px);animation:flt var(--t,9s) ease-in-out infinite alternate}
.sph{height:var(--s);border-radius:50%;background:radial-gradient(circle at 30% 25%,rgb(255 255 255/.95),rgb(255 255 255/.3) 16%,color-mix(in srgb,var(--h) 55%,transparent) 55%,color-mix(in srgb,var(--h) 85%,#000) 100%);box-shadow:inset -10px -14px 26px rgb(0 0 0/.28),inset 8px 10px 16px rgb(255 255 255/.45),0 34px 44px -22px var(--shadow)}
.cap{height:calc(var(--s)*.36);border-radius:999px;rotate:var(--a);background:linear-gradient(180deg,rgb(255 255 255/.3),rgb(255 255 255/.04) 55%),linear-gradient(135deg,var(--ga),var(--gb));border:1px solid var(--edge);box-shadow:inset 0 2px 2px var(--hi),inset 0 -10px 20px rgb(255 255 255/.1),0 30px 50px -26px var(--shadow)}
.tor{height:var(--s);border-radius:50%;border:calc(var(--s)*.07) solid rgb(255 255 255/.14);rotate:1 .3 0 62deg;animation:tw 24s linear infinite;box-shadow:inset 0 3px 3px var(--hi),inset 0 -6px 12px rgb(0 0 0/.2),0 24px 34px -18px var(--shadow)}
@keyframes tw{to{transform:rotate(360deg)}}
.glass{backdrop-filter:blur(34px) saturate(200%) brightness(1.08);-webkit-backdrop-filter:blur(34px) saturate(200%) brightness(1.08);background:linear-gradient(180deg,rgb(255 255 255/.28),rgb(255 255 255/0) 38%),linear-gradient(135deg,var(--ga),var(--gb));border-top-color:var(--hi);border-left-color:var(--hi);box-shadow:0 44px 80px -32px var(--shadow),0 10px 20px -12px var(--shadow),inset 0 2px 1px var(--hi),inset 1px 0 1px rgb(255 255 255/.28),inset 0 -16px 30px -12px rgb(255 255 255/.16),inset 0 -2px 6px rgb(0 0 0/.14)}
.glass.ghost{box-shadow:0 56px 90px -24px var(--shadow),inset 0 2px 1px var(--hi)}
.tile:hover{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.04)}
.tile .ico,.m-orb .ico{box-shadow:inset 0 3px 2px rgb(255 255 255/.8),inset 0 -9px 16px rgb(0 0 0/.24),inset 0 0 0 1px rgb(255 255 255/.3),0 20px 32px -10px var(--h)}
.tile .ico::after,.m-orb .ico::after{content:"";position:absolute;inset:5% 14% 55%;border-radius:50%/70%;background:linear-gradient(rgb(255 255 255/.8),transparent)}
.m-orb .ico{z-index:3}
.main>.sweep{position:absolute;top:-20%;bottom:-20%;left:-40%;width:30%;background:linear-gradient(100deg,transparent,rgb(255 255 255/.3),transparent);transform:skewX(-18deg);animation:swp 6.5s ease-in-out infinite;pointer-events:none}
@keyframes swp{0%,55%{translate:0}100%{translate:560%}}
.m-orb{transform-style:preserve-3d;perspective:800px;transform:rotateX(calc(var(--rx,0deg)*-1.6)) rotateY(calc(var(--ry,0deg)*1.6))}
.s{--w:14%;position:absolute;left:50%;top:50%;width:var(--w);aspect-ratio:1;margin:calc(var(--w)/-2) 0 0 calc(var(--w)/-2);border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,color-mix(in srgb,var(--h) 55%,#fff) 28%,var(--h) 62%,color-mix(in srgb,var(--h) 55%,#000));box-shadow:inset -4px -6px 10px rgb(0 0 0/.25),0 10px 18px -6px var(--h)}
.m-name span{animation-fill-mode:backwards}
/* AI Hub — neural orbit */
[data-id=ai-hub] .s{--w:calc(8% + var(--k)*1.6%);animation:orb calc(6s + var(--k)*1.4s) linear infinite}
@keyframes orb{from{transform:rotateZ(calc(var(--k)*60deg)) rotateX(68deg) translateX(300%) rotateX(-68deg)}to{transform:rotateZ(calc(var(--k)*60deg + 360deg)) rotateX(68deg) translateX(300%) rotateX(-68deg)}}
[data-id=ai-hub] .ico{animation:ic1 4s ease-in-out infinite}@keyframes ic1{50%{transform:translateY(-8px) rotateY(18deg)}}
[data-id=ai-hub] .m-name span,[data-id=clipboard] .m-name span{animation:rise .8s var(--ease) backwards,wv 3s ease-in-out infinite;animation-delay:calc(var(--i)*28ms),calc(var(--i)*120ms + 1s)}@keyframes wv{50%{transform:translateY(-7px)}}
/* Prompt Studio — typing lines */
[data-id=instruction-forge] .s{--w:calc(28% + var(--k)*5%);height:7%;aspect-ratio:auto;border-radius:99px;left:4%;top:calc(10% + var(--k)*12%);margin:0;translate:0 0 -50px;transform-origin:left;animation:typ 3.6s ease-in-out infinite;animation-delay:calc(var(--k)*.35s)}
@keyframes typ{0%{transform:scaleX(0);opacity:1}35%,70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
[data-id=instruction-forge] .ico{animation:ic2 3s ease-in-out infinite}@keyframes ic2{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
[data-id=instruction-forge] .r1{animation-direction:reverse;animation-duration:14s}
/* AI Playground — rising bubbles */
[data-id=ai-lab] .s{--w:calc(7% + var(--k)*1.5%);top:auto;bottom:4%;margin:0;left:calc(16% + var(--k)*11%);opacity:0;animation:bub calc(3.4s + var(--k)*.5s) ease-in infinite;animation-delay:calc(var(--k)*-.9s)}
@keyframes bub{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:.95}50%{transform:translate(14px,-120px)}100%{opacity:0;transform:translate(-10px,-240px) scale(1.15)}}

/* ===== Glass hero icon clarity: keep the selected app glyph crisp and use its own accent ===== */

.main .m-orb { perspective: none; transform: none; transform-style: flat; }

/* ===== Audit consistency pass (Glass) =====
   - header/content share one width that grows on large windows instead of freezing at 1240px
   - greeting aligns with the dock's inner edge and the subtitle stays readable over the busy scene
   - Live System panels are stacked: gauge + readout on top, sparkline fills the remaining panel height
   - gauge, hero orb and type scale with window height so tall windows do not leave empty panels */
@media (min-width: 900px) and (min-height: 480px) {
  .top,.layout { width: min(clamp(1240px, 88vw, 1840px), 100%); max-width: none; }
  .top { margin-bottom: 14px; }
  .hello { padding: 0 12px; }
  .hello p { color: color-mix(in srgb, var(--text) 82%, transparent); text-shadow: 0 1px 14px rgb(0 0 0/.45), 0 0 2px rgb(0 0 0/.25); font-weight: 400; }

  .main { --o: clamp(150px, 20vh, 230px); }
  .m-orb { display: grid; width: var(--o); max-width: none; flex: none; }
  .m-name { font-size: clamp(27px, min(2.8vw, 4.6vh), 54px); }
  .sys { display: flex; flex-direction: column; }
  .sys .sec-h { flex: none; }
  .pn { flex: 1 1 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); align-items: stretch; align-content: stretch; gap: 8px; padding: clamp(8px, 1.4vh, 16px) 12px; }
  .pn-top { align-self: start; }
  .pn .spark { grid-column: 1; height: 100%; min-height: 26px; align-self: stretch; }
  .spark .line { stroke-width: 2.5; }
  .gauge { width: clamp(52px, 8.4vh, 84px); height: clamp(52px, 8.4vh, 84px); }
  .gauge b { font-size: clamp(13px, 1.9vh, 18px); }
  .pn-txt .lbl { font-size: clamp(10px, 1.45vh, 13px); }
  .pn-txt>b { font-size: clamp(18px, 2.8vh, 28px); }
  .pn-txt small { font-size: clamp(10px, 1.4vh, 12.5px); }
}
@media (min-width: 900px) and (min-height: 480px) and (max-height: 760px) {
  .main { --o: 126px; }
  .gauge { width: 52px; height: 52px; }
}

  .rail .sec-h { margin-bottom: 4px; } .rail .sec-h h2 { font-size: 15px; }

  .tile .tag { padding-right: 24px; }
  .tile .key { right: 8px; bottom: 7px; min-width: 20px; height: 20px; }

<script>
/* Mad Station host bridge for the Glass homepage. */
(function () {
  'use strict';
  const CHANNEL = 'madstation-home-glass';
  const isFramed = window.parent !== window;
  const allowedMemoryActions = new Set(['refresh', 'cleanup', 'details']);
  let ready = false;

  function sendHost(type, detail = {}) {
    if (!isFramed) return false;
    try { window.parent.postMessage({ channel: CHANNEL, type, ...detail }, '*'); return true; }
    catch { return false; }
  }

  window.MadHomeApps?.setLauncher?.((target) => {
    if (typeof target === 'string' && target.length <= 80) sendHost('launch', { target });
  });
  if (window.MadHome) {
    window.MadHome.inApp = isFramed || Boolean(window.MadStationMemoryMonitor);
    window.MadHome.toggleTheme = () => sendHost('toggle-theme');
    window.MadHome.memoryAction = (action) => { if (allowedMemoryActions.has(action)) sendHost('memory-action', { action }); };
  }
  document.getElementById('launcherSettingsBtn')?.addEventListener('click', () => sendHost('open-settings'));
  // Mad Station owns the theme preference while Glass is embedded; keep standalone preview toggling intact.
  document.getElementById('themeBtn')?.addEventListener('click', (event) => {
    if (!isFramed) return;
    event.preventDefault();
    event.stopImmediatePropagation();
    sendHost('toggle-theme');
  }, true);

  function applySettings(settings) {
    if (!settings || typeof settings !== 'object' || Array.isArray(settings)) return;
    const requestedTheme = ['dark', 'light', 'system'].includes(settings.theme) ? settings.theme : document.body.dataset.theme;
    const systemLight = Boolean(window.matchMedia?.('(prefers-color-scheme: light)').matches);
    document.body.dataset.theme = requestedTheme === 'system' ? (systemLight ? 'light' : 'dark') : requestedTheme;
    document.body.classList.toggle('reduce-motion', Boolean(settings.reduceMotion));
    document.body.classList.toggle('no-hover-animation', settings.animateHover === false);
    window.MadHome?.setStats?.({ accounts: Number(settings.accounts) || 0, providers: Number(settings.providers) || 0 });
  }

  window.addEventListener('message', (event) => {
    if (!isFramed || event.source !== window.parent || event.data?.channel !== CHANNEL) return;
    const message = event.data;
    if (!message || typeof message.type !== 'string') return;
    if (message.type === 'host-ping') {
      if (ready) sendHost('home-ready');
    } else if (message.type === 'appearance-settings') {
      applySettings(message.settings);
    } else if (message.type === 'memory-model' && message.model && typeof message.model === 'object' && !Array.isArray(message.model)) {
      document.dispatchEvent(new CustomEvent('mad:memory-model', { detail: message.model }));
    } else if (message.type === 'stats') {
      window.MadHome?.setStats?.({ accounts: message.accounts, providers: message.providers });
    }
  });
  window.addEventListener('error', () => { if (!ready) sendHost('home-error'); });
  window.addEventListener('unhandledrejection', () => { if (!ready) sendHost('home-error'); });
  function markReady() { ready = true; sendHost('home-ready'); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', markReady, { once: true });
  else queueMicrotask(markReady);
})();
</script>
