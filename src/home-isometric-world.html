<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"/>
<title>Mad Station — Isometric World</title>
<style>
/* Mad Station — Home v14 "Isometric World". A miniature floating island you can orbit, zoom and explore. CSP-safe, self-contained. */
body{--bg:#06080d;--s1:#0e131c;--s2:#161d2a;--line:#232c3f;--text:#eff3fa;--muted:#8d9ab2;--a:var(--accent,#7c9cff);--on:#06101e;--glass:rgb(14 19 30/.72);--fxc:150 178 255;
  --c1:#7c9cff;--c2:#b18cff;--c3:#ff8bb5;--c4:#ffb36b;--c5:#4fd8a4;--c6:#5ccfe0;--ok:#4fd8a4;--gold:#ffd166;color-scheme:dark}
body[data-theme=light]{--bg:#dfeaf7;--s1:#fff;--s2:#f1f4fa;--line:#d8e0ee;--text:#121a2c;--muted:#56637b;--on:#fff;--glass:rgb(255 255 255/.74);--fxc:60 90 200;
  --c1:#3d63d8;--c2:#7447d8;--c3:#c93580;--c4:#c0640f;--c5:#12895c;--c6:#0f8497;--ok:#12895c;--gold:#c58a00;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit}button{cursor:pointer}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
h1,h2,p,ul{margin:0;padding:0}ul{list-style:none}
kbd{border:1px solid var(--line);border-radius:7px;padding:1px 8px;font:600 11px/1.6 inherit;color:var(--muted)}

/* ---- the world canvas ---- */
#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#world.hot{cursor:pointer}#world.grabbing{cursor:grabbing}#world.arr{cursor:move}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 46%,transparent 55%,rgb(2 4 12/.5)),linear-gradient(rgb(2 4 12/.35),transparent 16%,transparent 80%,rgb(2 4 12/.4))}
body[data-theme=light] .vig{background:radial-gradient(120% 90% at 50% 46%,transparent 62%,rgb(40 70 130/.22)),linear-gradient(rgb(255 255 255/.25),transparent 14%,transparent 82%,rgb(255 255 255/.3))}
.hud{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hud>*{pointer-events:auto}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);box-shadow:0 18px 40px -22px rgb(0 0 0/.55)}

/* ---- floating labels pinned to buildings ---- */
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
body.labels-hidden .labels{visibility:hidden}
.tag3d[data-ms-world-debug-hidden="true"]{display:none!important}
.tag3d{--h:var(--a);position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px 0 5px;border:1px solid color-mix(in srgb,var(--h) 45%,var(--line));border-radius:999px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:var(--text);white-space:nowrap;font-weight:650;font-size:13px;letter-spacing:-.005em;pointer-events:auto;will-change:transform;box-shadow:0 12px 26px -14px var(--h);transition:border-color .2s,box-shadow .2s,opacity .25s,background .2s}
.tag3d[data-h="1"],.rail .ri[data-h="1"],.info[data-h="1"],.pal-list li[data-h="1"]{--h:var(--c1)}.tag3d[data-h="2"],.rail .ri[data-h="2"],.info[data-h="2"],.pal-list li[data-h="2"]{--h:var(--c2)}
.tag3d[data-h="3"],.rail .ri[data-h="3"],.info[data-h="3"],.pal-list li[data-h="3"]{--h:var(--c3)}.tag3d[data-h="4"],.rail .ri[data-h="4"],.info[data-h="4"],.pal-list li[data-h="4"]{--h:var(--c4)}
.tag3d[data-h="5"],.rail .ri[data-h="5"],.info[data-h="5"],.pal-list li[data-h="5"]{--h:var(--c5)}.tag3d[data-h="6"],.rail .ri[data-h="6"],.info[data-h="6"],.pal-list li[data-h="6"]{--h:var(--c6)}
.tag3d .li{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--on);background:linear-gradient(140deg,var(--h),color-mix(in srgb,var(--h) 52%,#000))}
.tag3d .li svg{width:14px;height:14px;stroke-width:2.1}
.tag3d .lt{max-width:0;overflow:hidden;opacity:0;color:var(--muted);font-weight:500;font-size:12px;transition:max-width .3s ease,opacity .25s,margin .3s;margin-left:-4px}
.tag3d.on .lt,.tag3d:focus-visible .lt{max-width:230px;opacity:1;margin-left:2px}
.tag3d.on,.tag3d:hover{border-color:var(--h);box-shadow:0 14px 34px -12px var(--h)}
.tag3d.star::before{content:"★";color:var(--gold);font-size:13px;margin:0 -2px 0 2px;order:2}
.tag3d.sel{background:color-mix(in srgb,var(--h) 22%,var(--glass))}
body.arranging .tag3d{cursor:grab}body.arranging .tag3d:active{cursor:grabbing}
.tag3d.far{opacity:.0;pointer-events:none}
.tag3d.dim{opacity:.55}

/* ---- plaque (top-left) ---- */
.plaque{position:absolute;left:22px;top:20px;display:flex;align-items:center;gap:12px;padding:9px 18px 9px 11px;border-radius:20px}
.mark{width:38px;height:38px;display:grid;place-items:center;color:var(--a);perspective:220px}.mark svg{width:34px;height:34px;animation:logo 7s linear infinite;filter:drop-shadow(0 0 8px var(--a))}@keyframes logo{to{transform:rotateY(360deg)}}
.pl-t{display:grid;gap:0;line-height:1.15}.pl-t strong{font-size:17px;letter-spacing:-.015em;font-weight:700}
.pl-t strong b{background:linear-gradient(90deg,var(--a),var(--c2),var(--c3),var(--a));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}@keyframes shim{to{background-position:-200% 0}}
.pl-t span{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
.pl-t em{font-style:normal;animation:blink 1s steps(2,start) infinite}@keyframes blink{50%{opacity:.25}}

/* ---- tools (top-right) ---- */
.tools{position:absolute;right:22px;top:20px;display:flex;gap:8px;align-items:center}
.icon{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:15px;color:var(--muted);transition:.18s}
.icon svg{width:19px;height:19px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}.icon:hover{border-color:var(--a);color:var(--text);transform:translateY(-2px);box-shadow:0 12px 26px -12px var(--a)}.icon:hover svg{transform:rotate(14deg) scale(1.1)}
.icon[aria-pressed=true]{color:var(--on);background:var(--a);border-color:var(--a)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:54px;width:268px;padding:10px;border:1px solid var(--line);border-radius:18px;background:var(--s1);box-shadow:0 24px 54px rgb(0 0 0/.4);animation:pop .16s both;max-height:min(72vh,560px);overflow:auto;z-index:40}
.menu h2{margin:4px 8px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}.menu h2.gap{margin-top:12px}
.menu label{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}.menu label:hover{background:var(--s2)}
.menu input{accent-color:var(--a);width:16px;height:16px}
.menu .reset{width:100%;margin-top:6px;height:36px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--muted)}.menu .reset:hover{color:var(--text);border-color:var(--a)}

/* ---- app rail (left, vertical like a build menu) ---- */
.rail{position:absolute;left:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;padding:10px;border-radius:24px}
/* Apps already live inside the Isometric World; hide the duplicate outer app launcher on every screen size. */
#rail{display:none!important}
.ri{--h:var(--a);position:relative;width:52px;height:52px;border:0;border-radius:17px;display:grid;place-items:center;padding:0;color:var(--on);background:linear-gradient(140deg,var(--h),color-mix(in srgb,var(--h) 52%,#000));
  box-shadow:0 10px 20px -10px var(--h),0 1px 0 rgb(255 255 255/.35) inset,0 -6px 10px -6px rgb(0 0 0/.35) inset;transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,filter .2s;animation:up .6s both;animation-delay:calc(var(--i,0)*70ms)}
.ri svg{width:23px;height:23px}.ri:hover,.ri:focus-visible{transform:translateX(5px) scale(1.07)}
.ri.sel{outline:2px solid var(--h);outline-offset:3px;transform:translateX(6px)}
.ri .n{position:absolute;right:-5px;bottom:-5px;min-width:19px;height:19px;border-radius:7px;display:grid;place-items:center;background:var(--s1);color:var(--muted);border:1px solid var(--line);font-size:10.5px;font-weight:700}
.ri .st{position:absolute;left:-5px;top:-5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);color:var(--gold)}.ri .st svg{width:11px;height:11px;fill:currentColor;stroke:none}
.ri .rt{position:absolute;left:calc(100% + 16px);top:50%;transform:translate(-6px,-50%);display:grid;padding:8px 13px;border:1px solid var(--line);border-radius:13px;background:var(--s1);color:var(--text);text-align:left;white-space:nowrap;opacity:0;pointer-events:none;transition:.16s;box-shadow:0 16px 34px rgb(0 0 0/.4);z-index:5}
.ri .rt strong{font-size:14px}.ri .rt small{font-size:11.5px;color:var(--muted)}.ri:hover .rt,.ri:focus-visible .rt{opacity:1;transform:translate(0,-50%)}

/* ---- live system (bottom-left) ---- */
.sys{position:absolute;left:22px;bottom:22px;width:300px;padding:14px 16px 12px;border-radius:24px;transition:box-shadow .3s,border-color .3s}
.sys.flash{border-color:var(--c6);box-shadow:0 0 0 3px color-mix(in srgb,var(--c6) 30%,transparent),0 18px 40px -22px rgb(0 0 0/.55)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-h h2{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.hint{font-size:11.5px;color:var(--muted)}
.gauges{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 10px}
.ring{position:relative;width:62px;height:62px}.ring svg{width:62px;height:62px;transform:rotate(-90deg);stroke-width:6;overflow:visible}
.ring .bg{stroke:color-mix(in srgb,var(--muted) 22%,transparent)}.ring .fg{stroke:var(--c1);stroke-dasharray:163.4;stroke-dashoffset:163.4;transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c1) 60%,transparent))}
.g.cpu .ring .fg{stroke:var(--c5);filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c5) 60%,transparent))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.g-t{display:grid;line-height:1.2;color:var(--muted);font-size:12px}.g-t strong{color:var(--text);font-size:13.5px}
.spark{grid-column:1/-1;width:100%;height:26px;margin-top:6px;overflow:visible}
.spark .line{stroke:var(--c1);stroke-width:1.8;vector-effect:non-scaling-stroke}.spark .area{fill:color-mix(in srgb,var(--c1) 18%,transparent);stroke:none}
.g.cpu .spark .line{stroke:var(--c5)}.g.cpu .spark .area{fill:color-mix(in srgb,var(--c5) 18%,transparent)}
.sys-sub{margin-top:8px;font-size:11.5px;color:var(--muted)}
.sys-head-actions{display:inline-flex;align-items:center;justify-content:flex-end;gap:7px;min-width:0}
.sys-refresh-btn{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;padding:0;border:1px solid color-mix(in srgb,var(--a) 32%,var(--line));border-radius:10px;background:color-mix(in srgb,var(--s2) 70%,transparent);color:var(--a);transition:background .2s,border-color .2s,transform .2s}
.sys-refresh-btn svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;transition:transform .48s}
.sys-refresh-btn:hover{background:color-mix(in srgb,var(--a) 18%,var(--s2));border-color:var(--a);transform:translateY(-1px)}
.sys-refresh-btn:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.sys-refresh-btn.is-refreshing svg{transform:rotate(360deg)}

/* ---- camera pad (bottom-right) ---- */
.camera{position:absolute;right:22px;bottom:22px;display:grid;grid-template-columns:repeat(3,44px);gap:6px;padding:10px;border-radius:24px}
.camera button{width:44px;height:44px;border:1px solid transparent;border-radius:14px;background:color-mix(in srgb,var(--s2) 70%,transparent);display:grid;place-items:center;color:var(--muted);transition:.15s;padding:0}
.camera button svg{width:18px;height:18px}.camera button:hover{color:var(--text);border-color:var(--a);background:var(--s2)}.camera button:active{transform:scale(.92)}
.camera button[aria-pressed=true]{color:var(--on);background:var(--a)}
.camera .cmp svg{width:26px;height:26px;stroke-width:1.5}.camera .cmp i{display:block;transform-origin:50% 50%}
.camera .cmp .nd{fill:var(--c3);stroke:none}

.hintbar{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);display:flex;gap:16px;padding:7px 16px;border-radius:999px;font-size:12px;color:var(--muted);white-space:nowrap;transition:opacity .6s,transform .6s}
.hintbar.gone{opacity:0;transform:translate(-50%,10px);pointer-events:none}.hintbar b{color:var(--text);font-weight:600}

/* ---- info card (right) ---- */
.info{--h:var(--a);position:absolute;right:22px;top:50%;width:348px;padding:18px 18px 16px;border-radius:28px;border-color:color-mix(in srgb,var(--h) 42%,var(--line));transform:translate(34px,-50%);opacity:0;pointer-events:none;transition:transform .45s cubic-bezier(.2,.9,.3,1.1),opacity .3s;overflow:hidden}
.info.show{transform:translate(0,-50%);opacity:1;pointer-events:auto}
.info::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(90% 70% at 0% 0%,color-mix(in srgb,var(--h) 26%,transparent),transparent 62%)}
.info>*{position:relative;z-index:1}
.i-top{display:flex;align-items:center;gap:14px}
.ico{flex:none;width:58px;height:58px;border-radius:19px;display:grid;place-items:center;color:var(--on);background:linear-gradient(140deg,var(--h),color-mix(in srgb,var(--h) 52%,#000));box-shadow:0 14px 26px -12px var(--h),0 1px 0 rgb(255 255 255/.35) inset,0 -6px 10px -6px rgb(0 0 0/.35) inset}
.ico svg{width:28px;height:28px}
.i-t{min-width:0;flex:1}.i-t strong{display:block;font-size:22px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.i-st{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--muted);font-size:12.5px}
/* Keep the close control above the full-width title row: the latter is painted later and otherwise steals clicks over the left side of the button. Reserve its space and give it an explicit higher stacking order. */
.info .i-top{padding-right:32px}
.info .x{position:absolute!important;z-index:3!important;right:12px;top:12px;width:32px;height:32px;border:0;border-radius:11px;background:none;color:var(--muted);display:grid;place-items:center;pointer-events:auto}.x:hover{background:var(--s2);color:var(--text)}.x svg{width:16px;height:16px}
.fcs{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.fc{display:inline-flex;align-items:center;height:28px;padding:0 12px;border:1px solid color-mix(in srgb,var(--h) 35%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--h) 10%,transparent);font-size:12.5px}
.vis{position:relative;height:84px;margin:10px 0 12px;padding:6px 4px;color:var(--h);border-radius:16px;background:color-mix(in srgb,var(--s1) 55%,transparent);border:1px solid var(--line)}
.vis>*{max-height:100%}.vis svg{width:100%;height:100%;overflow:visible;fill:none;stroke-width:1.4}
.i-act{display:flex;gap:8px;align-items:center}
.open{flex:1;min-width:0;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 14px;font-size:13.5px;border:0;border-radius:999px;background:linear-gradient(140deg,var(--h),color-mix(in srgb,var(--h) 55%,#000));color:var(--on);font-weight:700;box-shadow:0 14px 30px -12px var(--h);transition:.2s}
.open svg{width:18px;height:18px;transition:transform .2s}.open:hover{transform:translateY(-2px)}.open:hover svg{transform:translateX(4px)}
.sq{flex:none;height:46px;display:inline-flex;align-items:center;gap:7px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--glass);color:var(--text);font-size:13px;font-weight:600;transition:.18s}
.sq svg{width:15px;height:15px;fill:currentColor;stroke:none;color:var(--gold)}.sq:hover{border-color:var(--gold)}.sq[disabled]{opacity:.7;cursor:default;border-color:color-mix(in srgb,var(--gold) 50%,var(--line))}
.i-keys{margin-top:10px;font-size:11.5px;color:var(--muted);display:flex;gap:12px}

/* ---- arrange banner + tooltip ---- */
.arr-b{white-space:nowrap;max-width:calc(100vw - 24px);position:absolute;left:50%;top:20px;transform:translate(-50%,-14px);display:flex;align-items:center;gap:14px;padding:9px 10px 9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;border-color:var(--gold)}
.arr-b.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}.arr-b b{color:var(--gold)}
.arr-b button{height:32px;padding:0 15px;border:0;border-radius:999px;background:var(--gold);color:#1b1500;font-weight:700}
.tip{position:absolute;left:0;top:0;padding:6px 11px;border:1px solid var(--line);border-radius:11px;background:var(--s1);box-shadow:0 12px 28px rgb(0 0 0/.4);font-size:12.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
.tip.show{opacity:1}.tip small{color:var(--muted);margin-left:6px}

/* ---- AI-app mini animations (carried over from the previous home) ---- */
.nn .ln{stroke:currentColor;opacity:.4;stroke-dasharray:3 6;animation:flow 1.6s linear infinite}
.nn .nd{fill:var(--s1);stroke:currentColor;stroke-width:1.8;transform-box:fill-box;transform-origin:center;animation:node 2.4s ease-in-out infinite}
.nn .nd:nth-of-type(2n){animation-delay:-.8s}.nn .nd:nth-of-type(3n){animation-delay:-1.5s}
.nn .core{fill:currentColor;stroke:none;transform-box:fill-box;transform-origin:center;animation:node 2s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-18}}@keyframes node{50%{transform:scale(1.35);fill:currentColor}}
.pr{position:relative;display:grid;gap:9px;align-content:center;height:100%}
.pr b{display:block;height:7px;border-radius:4px;background:linear-gradient(90deg,currentColor,color-mix(in srgb,currentColor 30%,transparent));opacity:.75;width:0;animation:typ 4.2s steps(14,end) infinite}
.pr b:nth-child(1){--w:88%}.pr b:nth-child(2){--w:64%;animation-delay:.5s}.pr b:nth-child(3){--w:42%;animation-delay:1s}
.pr i{position:absolute;right:0;top:0;width:18px;height:18px;background:currentColor;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:spark2 2.6s ease-in-out infinite}
@keyframes typ{0%{width:0}40%,85%{width:var(--w)}100%{width:0}}@keyframes spark2{50%{transform:scale(.4) rotate(90deg);opacity:.4}}
.ar{display:grid;gap:9px;align-content:center;height:100%}
.ar span{display:block;height:9px;border-radius:5px;background:color-mix(in srgb,currentColor 14%,transparent);overflow:hidden}
.ar span::after{content:"";display:block;height:100%;border-radius:inherit;background:currentColor;transform-origin:left;transform:scaleX(.04);animation:race 3.6s cubic-bezier(.4,0,.2,1) infinite}
.ar span:nth-child(1)::after{--w:.94}.ar span:nth-child(2)::after{--w:.72;animation-delay:.12s;opacity:.7}.ar span:nth-child(3)::after{--w:.56;animation-delay:.24s;opacity:.5}
@keyframes race{0%{transform:scaleX(.04)}55%,88%{transform:scaleX(var(--w))}100%{transform:scaleX(.04)}}
.vd{position:relative;display:flex;gap:5px;align-items:center;height:100%}
.vd b{flex:1;height:70%;border-radius:6px;border:1.5px solid currentColor;opacity:.35;animation:frame 4s linear infinite}
.vd b:nth-child(2){animation-delay:.5s}.vd b:nth-child(3){animation-delay:1s}.vd b:nth-child(4){animation-delay:1.5s}.vd b:nth-child(5){animation-delay:2s}.vd b:nth-child(6){animation-delay:2.5s}.vd b:nth-child(7){animation-delay:3s}.vd b:nth-child(8){animation-delay:3.5s}

@keyframes frame{0%{opacity:1;background:color-mix(in srgb,currentColor 35%,transparent)}14%,100%{opacity:.35;background:none}}@keyframes scrub{from{left:0}to{left:100%}}
.im{display:grid;grid-template-columns:repeat(14,1fr);grid-template-rows:repeat(4,1fr);gap:3px;height:100%}
.im b{border-radius:3px;background:currentColor;opacity:.08;animation:diff 4.4s ease-in-out infinite}
.im b:nth-child(2n){animation-delay:.4s}.im b:nth-child(3n){animation-delay:.9s}.im b:nth-child(5n){animation-delay:1.4s}.im b:nth-child(7n){animation-delay:.2s}.im b:nth-child(11n){animation-delay:1.1s}
.im b:nth-child(4n){--o:.9}.im b:nth-child(4n+1){--o:.55}.im b:nth-child(4n+2){--o:.75}.im b:nth-child(4n+3){--o:.35}
@keyframes diff{0%,10%{opacity:.08;transform:scale(.7)}45%,80%{opacity:var(--o,.7);transform:none}100%{opacity:.08;transform:scale(.7)}}
.nt{display:grid;gap:9px;align-content:center;height:100%}.nt div{display:flex;align-items:center;gap:10px}
.nt em{position:relative;width:14px;height:14px;border-radius:5px;border:1.6px solid currentColor;flex:none}
.nt em::after{content:"";position:absolute;inset:2px;border-radius:2px;background:currentColor;transform:scale(0);animation:tick 4.4s ease-in-out infinite}
.nt s{display:block;height:6px;border-radius:3px;background:color-mix(in srgb,currentColor 40%,transparent);animation:strike 4.4s ease-in-out infinite}
.nt div:nth-child(1) s{width:78%}.nt div:nth-child(2) s{width:58%;animation-delay:.9s}.nt div:nth-child(3) s{width:68%;animation-delay:1.8s}
.nt div:nth-child(2) em::after{animation-delay:.9s}.nt div:nth-child(3) em::after{animation-delay:1.8s}
@keyframes tick{0%,8%{transform:scale(0)}18%,78%{transform:scale(1)}92%,100%{transform:scale(0)}}@keyframes strike{0%,8%{opacity:.95}18%,78%{opacity:.35}92%,100%{opacity:.95}}

<script>
(function () {

/* ======================================================================
   ENGINE — a tiny orthographic 3D renderer on Canvas 2D (flat-shaded polygons, painter's sort)

const TAU = Math.PI * 2, PI = Math.PI, HP = PI / 2;

  ENV.amb = mix3(DAYP.amb, NGHTP.amb, q / 24); ENV.sun = mix3(DAYP.sun, NGHTP.sun, q / 24); ENV.ver++;
}
class Mat {
  /* c: base colour. o.emit: glow colour (blends in at night). o.day: emission even by day (neon/screens). o.a: alpha */
  constructor(c, o = {}) { this.rgb = typeof c === 'string' ? hex(c) : c; this.emit = o.emit ? hex(o.emit) : null; this.glow = o.glow == null ? 1 : o.glow; this.day = o.day || 0; this.a = o.a == null ? 1 : o.a; this.c = []; this.v = 0; }

const M = (c, o) => new Mat(c, o);

/* ---------- camera ---------- */
const cam = { az: PI / 4, el: .615, s: 28, tx: 0, ty: 1.4, tz: 0, cx: 0, cy: 0, sa: 0, ca: 1, se: 0, ce: 1, dx: 0, dy: 0, dz: 0 };

    } else { for (let k = 0; k < 9; k++) this.R[k] = _M[k]; this.S = this.sc; this.t[0] = this.p[0]; this.t[1] = this.p[1]; this.t[2] = this.p[2]; this.oe = this.owner; this.bo = this.boost; this.vv = this.vis; }

/* ---------- little walkers on the roads ---------- */
{
  const hues = ['#7c9cff', '#b18cff', '#ff8bb5', '#ffb36b', '#4fd8a4', '#5ccfe0'];
  const skin = M('#f0c5a6'), hair = M('#2a2430'), eyes = M('#263044'), shoes = M('#182131');
  const pantsCols = ['#2d3a50', '#343049', '#4a3142', '#51402f', '#25483f', '#234550'];
  const bots = [];
  for (let i = 0; i < 6; i++) {
    const n = new Node(ROOT, 0, PAD_H, 0), shirt = M(hues[i]), pants = M(pantsCols[i]);
    // Torso and head are grouped so the upper body can sway gently while walking.
    const upper = new Node(n, 0, 0, 0); upper.axis = 'z';
    box(upper, 0, .22, 0, .19, .29, .11, shirt, { cast: false });
    box(upper, 0, .255, .058, .025, .20, .012, M('#dce5f3'));
    cyl(upper, 0, .49, 0, .035, .035, .065, 7, skin);
    sph(upper, 0, .625, 0, .083, .092, .079, 4, 8, skin);
    sph(upper, 0, .675, -.006, .084, .042, .082, 4, 8, hair, { hemi: true });
    // Tiny eyes are set on the forward side of the head to make the figures feel less like mannequins.
    sph(upper, -.027, .632, .073, .008, .009, .006, 2, 5, eyes);
    sph(upper,  .027, .632, .073, .008, .009, .006, 2, 5, eyes);

    const arms = [];
    for (const side of [-1, 1]) {
      const arm = new Node(upper, side * .115, .445, 0); arm.axis = 'x';
      box(arm, 0, -.075, 0, .055, .15, .06, shirt);
      const forearm = new Node(arm, 0, -.135, 0); forearm.axis = 'x';
      box(forearm, 0, -.062, 0, .047, .125, .052, shirt);
      sph(forearm, 0, -.088, .003, .032, .034, .032, 3, 6, skin); // visible hand
      arms.push({ arm, forearm, side });
    }

    const legs = [];
    for (const side of [-1, 1]) {
      const leg = new Node(n, side * .055, .22, 0); leg.axis = 'x';
      box(leg, 0, -.205, 0, .067, .205, .073, pants);
      // Low, forward-pointing shoes stay attached to the leg as it swings.
      box(leg, 0, -.218, .032, .083, .048, .132, shoes);

    }
    n.owner = null;
    bots.push({ n, upper, arms, legs, k: i % 5, ph: i * 1.7, off: (i < 5 ? -1 : 1) * .3, sp: .5 + (i % 3) * .12 });
  }
  LIFE.push((t) => {
    for (const b of bots) {
      const a = plotAng(b.k), r0 = PLAZA_R - .3, r1 = R_PAD - PAD_R + .3, L = r1 - r0;
      const u = ((t * b.sp + b.ph) / L) % 2, d = u < 1 ? u : 2 - u, dir = u < 1 ? 1 : -1, rr = r0 + d * L;
      const gait = t * (7.2 + b.sp * 2.2) + b.ph;
      const bob = (1 - Math.cos(gait * 2)) * .006;
      b.n.p = [Math.cos(a) * rr - Math.sin(a) * b.off, PAD_H + bob, Math.sin(a) * rr + Math.cos(a) * b.off];
      b.n.ry = Math.atan2(Math.cos(a) * dir, Math.sin(a) * dir);
      b.upper.spin = Math.sin(gait) * .035;
      for (const { leg, side } of b.legs) leg.spin = Math.sin(gait + (side < 0 ? 0 : Math.PI)) * .47;
      for (const { arm, forearm, side } of b.arms) {
        const phase = gait + (side < 0 ? Math.PI : 0);
        arm.spin = Math.sin(phase) * .48;
        forearm.spin = .12 + Math.max(0, Math.sin(phase + .7)) * .20;
      }
    }
  });
}
